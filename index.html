rking build; RC11 was rebuilt from it after RC10 failed.","tag":"v0.9.73-rc9","archive_folder":"versions/099_RC9_Revert_Baseline"},{"order":100,"version":"v0.9.73-rc11","description":"Rebuilt from RC9; stable jump commitment plus deer material-lighting adjustments.","why":"Explicit recovery after RC10 broke the app.","tag":"v0.9.73-rc11","archive_folder":"versions/100_RC11_Rebuilt_from_RC9"},{"order":101,"version":"v0.9.73-rc12","description":"Road-axis stationary facing-turn fix.","why":"Fixed finish heading while retaining RC11 surface/jump/ragdoll systems.","tag":"v0.9.73-rc12","archive_folder":"versions/101_RC12"},{"order":102,"version":"v0.9.73-rc13","description":"Turn completion gating, no-vanish safety and road-gait handoff fixes.","why":"Stabilized visible behavior across maps before later presentation/material passes.","tag":"v0.9.73-rc13","archive_folder":"versions/102_RC13"},{"order":103,"version":"v0.9.73-rc14","description":"Material brightness-only calibration: reduced ambient/diffuse/specular.","why":"First retained lighting correction; gameplay unchanged.","tag":"v0.9.73-rc14","archive_folder":"versions/103_RC14"},{"order":104,"version":"v0.9.73-rc15","description":"Astra material calibration with lower diffuse/specular and preserved rig/weights.","why":"Second retained material calibration pass.","tag":"v0.9.73-rc15","archive_folder":"versions/104_RC15"},{"order":105,"version":"v0.9.73-rc16","description":"Universal obstacle sensor and hard road-gait handoff; improved fence/rail detection.","why":"Major obstacle/gait compatibility milestone.","tag":"v0.9.73-rc16","archive_folder":"versions/105_RC16"},{"order":106,"version":"v0.9.73-rc17","description":"User-facing UI/Frenzy controls plus diffuse albedo calibration.","why":"Began the alpha-ready UI/presentation line.","tag":"v0.9.73-rc17","archive_folder":"versions/106_RC17"},{"order":107,"version":"v0.9.73-rc18","description":"Two-tab Main/Debug UI cleanup with conditional Frenzy slider.","why":"Es <script>
const REPO='https://github.com/prestoncaisse/assetto-corsa-deer-mod';
const COLORS=['#68d7ad','#55bbdb','#d6ac76','#b89aef','#f38a94'];
const PHASES=[{name:'Foundations',start:1,end:36,cx:210,cy:480,rx:170,ry:250},{name:'Collision & impact',start:37,end:59,cx:500,cy:315,rx:145,ry:190},{name:'Animation & stability',start:60,end:90,cx:780,cy:515,rx:175,ry:250},{name:'Release candidates',start:91,end:113,cx:1080,cy:330,rx:150,ry:205},{name:'Alpha & official v1',start:114,end:121,cx:1325,cy:550,rx:105,ry:145}];
const MAJOR=new Set([1,3,16,23,36,37,43,58,59,62,69,70,87,88,90,91,95,99,100,101,113,114,118,119,120,121]);
const ROLLBACK=new Set([3,17,70,88,100,119,120]);
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),urlpath=s=>s.split('/').map(encodeURIComponent).join('/');

const el=(name,attrs={},parent=world)=>{const x=document.createElementNS(svgNS,name);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);parent.appendChild(x);return x};
DATA.forEach(v=>{v.phase=PHASES.findIndex(p=>v.order>=p.start&&v.order<=p.end);const p=PHASES[v.phase],n=p.end-p.start+1,i=v.order-p.start,a=i*2.399963229728653,r=Math.sqrt((i+.5)/n);v.x=p.cx+Math.cos(a)*p.rx*r;v.y=p.cy+Math.sin(a)*p.ry*r});
const clusterLayer=el('g'),edgeLayer=el('g'),nodeLayer=el('g');const edgeEls=[],nodeEls=[];

for(let i=1;i<DATA.length;i++){const a=DATA[i-1],b=DATA[i],m=(a.x+b.x)/2,path='M'+a.x+','+a.y+' Q'+m+','+((a.y+b.y)/2-22)+' '+b.x+','+b.y;edgeEls[i]=el('path',{class:'edge'+(ROLLBACK.has(b.order)?' rollback':''),d:path},edgeLayer)}
DATA.forEach((v,i)=>{const g=el('g',{class:'node',transform:'translate('+v.x+' '+v.y+')','data-order':v.order,style:'color:'+COLORS[v.phase]},nodeLayer);el('circle',{r:v.order===121?13:MAJOR.has(v.order)?9:5,fill:COLORS[v.phase]},g);if(MAJOR.has(v.order)){const t=el('text',{x:14,y:4,class:'label-major'},g);t.textContent=v.version}nodeEls[i]=g;g.addEventListener('mouseenter',e=>showTip(e,v));g.addEventListener('mousemove',moveTip);g.addEventListener('mouseleave',()=>tooltip.style.display='none');g.addEventListener('click',e=>{e.stopPropagation();select(v.order)})});
let selected=121,query='',activePhase=-1,scale=1,tx=0,ty=0,drag=null;

function viewBoxPoint(e){const r=graph.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1500,y:(e.clientY-r.top)/r.height*900}}
function zoom(factor,point={x:750,y:450}){const next=Math.max(.48,Math.min(5,scale*factor));tx=point.x-(point.x-tx)*(next/scale);ty=point.y-(point.y-ty)*(next/scale);scale=next;updateTransform()}

graph.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};graph.setPointerCapture(e.pointerId);graph.classList.add('grabbing')});
graph.addEventListener('pointermove',e=>{if(!drag)return;const r=graph.getBoundingClientRect();tx=drag.tx+(e.clientX-drag.x)/r.width*1500;ty=drag.ty+(e.clientY-drag.y)/r.height*900;updateTransform()});
graph.addEventListener('pointerup',()=>{drag=null;graph.classList.remove('grabbing')});
$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);$('fit').onclick=()=>{scale=1;tx=0;ty=0;activePhase=-1;renderChapters();highlight();updateTransform()};
function focus(v){scale=2.1;tx=750-v.x*scale;ty=450-v.y*scale;updateTransform()}
function showTip(e,v){tooltip.innerHTML='<strong>'+esc(v.version)+'</strong><span>'+esc(v.description)+'</span>';tooltip.style.display='block';moveTip(e)}
function moveTip(e){const r=graph.getBoundingClientRect();tooltip.style.left=Math.min(e.clientX-r.left+18,r.width-260)+'px';tooltip.style.top=Math.max(10,Math.min(e.clientY-r.top+16,r.height-85))+'px'}
function highlight(){DATA.forEach((v,i)=>{const match=!query||[v.version,v.description,v.why||''].join(' ').toLowerCase().includes(query),inPhase=activePhase<0||v.phase===activePhase;nodeEls[i].classList.toggle('dim',!match||!inPhase);nodeEls[i].classList.toggle('match',!!query&&match);nodeEls[i].classList.toggle('active',v.order===selected);if(i>0){edgeEls[i].classList.toggle('active',v.order===selected||v.order===selected+1);edgeEls[i].classList.toggle('dim',!!query||activePhase>=0)}})}
