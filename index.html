<script>const DATA=[{"order":1,"version":"v0.3.0","description":"First DeerTest build with bidirectional track support.","why":"","tag":"v0.3.0","archive_folder":"versions/001_v0.3.0_bidirectional_foundation"},{"order":2,"version":"v0.3.2","description":"Stop/turn behaviors were gated until the deer had crossed at least halfway, establishing the early road-behavior rule.","why":"","tag":"v0.3.2","archive_folder":"versions/002_v0.3.2_halfway_behavior_gating"},{"order":3,"version":"v3.3","description":"Returned to v3.3 behavior after problems in v3.4.","why":"","tag":"v3.3-revert","archive_folder":"versions/003_v3.3_behavior_revert_baseline"},{"order":4,"version":"v0.4.0","description":"Integrated animated KN5/KSANIM state playback onto the stable v3.3-style behavior, including idle/walk/run/stop/turn/lookaround clips.","why":"","tag":"v0.4.0","archive_folder":"versions/004_v0.4.0_animated_integration"},{"order":5,"version":"v0.4.1","description":"Improved deer orientation and movement speed ahead of the v0.4.2 animation transitions.","why":"","tag":"v0.4.1","archive_folder":"versions/005_v0.4.1_orientation_speed_improvements"},{"order":6,"version":"v0.4.2","description":"Added separate WalkStop/RunStop and WalkStart/RunStart transitions while retaining the original turn animation.","why":"","tag":"v0.4.2","archive_folder":"versions/006_v0.4.2_stop_start_transition_foundation"},{"order":7,"version":"v0.4.3","description":"Added speed-dependent encounter distance, faster transitions, and movement during start clips instead of running in place.","why":"","tag":"v0.4.3","archive_folder":"versions/007_v0.4.3_speed-dependent_encounter_staging"},{"order":8,"version":"v0.4.4","description":"Separated staging distance from activation distance to avoid early crossings on curvy roads and added stricter ground validation.","why":"","tag":"v0.4.4","archive_folder":"versions/008_v0.4.4_staged_activation_spawn-ground_safeguards"},{"order":9,"version":"v0.4.5","description":"Fixed deer getting stuck in Waiting by storing spline position correctly and using robust signed spline-distance activation.","why":"","tag":"v0.4.5","archive_folder":"versions/009_v0.4.5_staged-deer_activation_fix"},{"order":10,"version":"v0.4.6","description":"Fixed occasional zero-deer encounters by retrying bad roadside spawn locations while retaining staged activation and ground safeguards.","why":"","tag":"v0.4.6","archive_folder":"versions/010_v0.4.6_spawn_retry_reliability"},{"order":11,"version":"v0.4.7","description":"Walkers trigger farther away while runners trigger closer, preserving the v0.4.6 retry and ground logic.","why":"","tag":"v0.4.7","archive_folder":"versions/011_v0.4.7_gait-dependent_activation_distance"},{"order":12,"version":"v0.4.8","description":"Rebuilt from v0.4.7 after the separate face-car v0.4.8 experiment; pause/turn/full-stop became road-only and deer had to continue off-road after the far edge.","why":"","tag":"v0.4.8","archive_folder":"versions/012_v0.4.8_road-zone_baseline"},{"order":13,"version":"v0.4.9","description":"Abandoned the turn-L/R test approach. Turnaround became gait stop → Lua 180° flip → gait start; turn.ksanim remained only for permanent road stops.","why":"","tag":"v0.4.9","archive_folder":"versions/013_v0.4.9_stop-flip-start_turnaround"},{"order":14,"version":"v0.5.0","description":"Kept stop-flip-start turnarounds while making permanent-stop turn direction static rather than dynamically tracking the player.","why":"","tag":"v0.5.0","archive_folder":"versions/014_v0.5.0_static_permanent-stop_turn"},{"order":15,"version":"v0.5.1","description":"Corrected the static permanent-stop turned orientation while retaining the v0.5.0 behavior model.","why":"","tag":"v0.5.1","archive_folder":"versions/015_v0.5.1_permanent-stop_turn_orientation_fix"},{"order":16,"version":"v0.5.2","description":"Established the 15–85% road window baseline used for subsequent behavior-window work.","why":"","tag":"v0.5.2","archive_folder":"versions/016_v0.5.2_road_behavior_window_baseline"},{"order":17,"version":"v0.5.5","description":"Rebuilt cleanly from known-good v0.5.2 after v0.5.3 broke/blanked the app; reintroduced independent behavior windows and the farther-spawn change from v0.5.4.","why":"","tag":"v0.5.5","archive_folder":"versions/017_v0.5.5_app-fix_rebuild_independent_zones"},{"order":18,"version":"v0.5.6","description":"Moved behavior eligibility to per-deer road-window measurements, strengthening road-relative pause/turn/stop behavior.","why":"","tag":"v0.5.6","archive_folder":"versions/018_v0.5.6_per-deer_road_windows"},{"order":19,"version":"v0.5.7","description":"Made special behaviors mutually exclusive and sped up the permanent-stop turn sequence.","why":"","tag":"v0.5.7","archive_folder":"versions/019_v0.5.7_exclusive_behaviors_faster_permastop_turn"},{"order":20,"version":"v0.5.8","description":"Retuned pause eligibility to a 20–80% road window while preserving independent behavior zones.","why":"","tag":"v0.5.8","archive_folder":"versions/020_v0.5.8_pause_20_80_window"},{"order":21,"version":"v0.5.9","description":"Combined ground handling, gait behavior, permanent-stop handling, and forced-turn/debug behavior into the next stable encounter base.","why":"","tag":"v0.5.9","archive_folder":"versions/021_v0.5.9_ground_gait_permastop_force-turn_pass"},{"order":22,"version":"v0.6.0","description":"Introduced hidden/pre-paused encounter staging so some deer could already be waiting near/at the road before reacting.","why":"","tag":"v0.6.0","archive_folder":"versions/022_v0.6.0_hidden_pre-paused_encounters"},{"order":23,"version":"v0.6.1","description":"Added high-speed walker lead timing. Development returned to this version after the v0.6.2/v0.6.3 dynamic-restaging attempts.","why":"","tag":"v0.6.1","archive_folder":"versions/023_v0.6.1_high-speed_walker_lead_revert_base"},{"order":24,"version":"v0.6.1a","description":"Added static facing behavior for prepaused/permanent-stop deer and forced-permastop debug behavior; v0.6.1b is an incremental transform/turn correction over this code.","why":"","tag":"v0.6.1a","archive_folder":"versions/024_v0.6.1a_prepaused_face-car_forced_permastop"},{"order":25,"version":"v0.6.1b","description":"Corrected world-facing turn planning and reverse playback so the turn animation finishes facing the intended static direction.","why":"","tag":"v0.6.1b","archive_folder":"versions/025_v0.6.1b_facing_turn_synchronization_fix"},{"order":26,"version":"v0.6.1c","description":"Refined turn-animation direction mapping. This later became the explicit timing/base revert point when v0.6.1d was discarded.","why":"","tag":"v0.6.1c","archive_folder":"versions/026_v0.6.1c_turn-animation_direction_fix"},{"order":27,"version":"v0.6.1e","description":"Explicitly reverted timing to v0.6.1c, discarded v0.6.1d earlier-activation tuning, and made walkers run from spawn to the actual roadside before switching to walk.","why":"","tag":"v0.6.1e","archive_folder":"versions/027_v0.6.1e_walkers_run_to_roadside"},{"order":28,"version":"v0.6.1f","description":"Moved activation closer and added hidden prepaused flee behavior while retaining roadside approach-running logic.","why":"","tag":"v0.6.1f","archive_folder":"versions/028_v0.6.1f_closer_activation_hidden_flee"},{"order":29,"version":"v0.6.1g","description":"Added normal-deer panic/near-miss reactions on top of the hidden/prepaused encounter system.","why":"","tag":"v0.6.1g","archive_folder":"versions/029_v0.6.1g_normal_panic_near-miss_behavior"},{"order":30,"version":"v0.6.3","description":"Introduced the detailed white-tailed-deer activity curve so encounter probability varied by time of day.","why":"","tag":"v0.6.3","archive_folder":"versions/030_v0.6.3_time-of-day_activity"},{"order":31,"version":"v0.6.4","description":"Deepened the daytime activity lull while retaining dawn/dusk/night weighting.","why":"","tag":"v0.6.4","archive_folder":"versions/031_v0.6.4_midday_activity_suppression"},{"order":32,"version":"v0.6.5","description":"Synchronized the activity curve to the Pure Planner/session clock so time-of-day encounter weighting followed the actual visual/session time.","why":"","tag":"v0.6.5","archive_folder":"versions/032_v0.6.5_Pure_Planner_clock_sync"},{"order":33,"version":"v0.6.6","description":"Introduced Frenzy mode for rapid 24/7 encounters with an active-deer safety cap; this system remained a core debug/gameplay feature.","why":"","tag":"v0.6.6","archive_folder":"versions/033_v0.6.6_Frenzy_mode"},{"order":34,"version":"v0.6.7","description":"Added headlight-triggered and permanent-stop reaction logic.","why":"","tag":"v0.6.7","archive_folder":"versions/034_v0.6.7_headlight_permastop_reactions"},{"order":35,"version":"v0.6.8","description":"Equalized the headlight stun probability across beam states.","why":"","tag":"v0.6.8","archive_folder":"versions/035_v0.6.8_equal_headlight_stun_chance"},{"order":36,"version":"v0.6.9","description":"Set headlight reactions to a 20% chance at 60 m.","why":"","tag":"v0.6.9","archive_folder":"versions/036_v0.6.9_headlight_20_at_60_m"},{"order":37,"version":"v0.8.2","description":"Known-good collision baseline: oriented car rectangle plus three deer body probes with rounded-corner contact; later v0.9.4 was explicitly rebuilt directly from this file.","why":"","tag":"v0.8.2","archive_folder":"versions/037_v0.8.2_tighter_collision_baseline"},{"order":38,"version":"v0.9","description":"First impact-physics version, introducing post-impact deer motion.","why":"","tag":"v0.9","archive_folder":"versions/038_v0.9_impact-physics_milestone"},{"order":39,"version":"v0.9.4","description":"Explicit rebuild from known-good v0.8.2 with no CSP physics namespace calls; added controlled ballistic launch, gravity, terrain bounce/slide and stable whole-body tumble.","why":"","tag":"v0.9.4","archive_folder":"versions/039_v0.9.4_controlled_tumble"},{"order":40,"version":"v0.9.5","description":"Strengthened controlled tumble while retaining the v0.9.4 safe ballistic foundation.","why":"","tag":"v0.9.5","archive_folder":"versions/040_v0.9.5_stronger_tumble"},{"order":41,"version":"v0.9.6","description":"Added stronger forward post-impact propulsion to the approved tumble model.","why":"","tag":"v0.9.6","archive_folder":"versions/041_v0.9.6_forward_propulsion"},{"order":42,"version":"v0.9.7","description":"Tuned the post-impact propulsion and became the working base later used for the persistent-contact rebuild.","why":"","tag":"v0.9.7","archive_folder":"versions/042_v0.9.7_propulsion_tuning"},{"order":43,"version":"v0.9.10","description":"Rebuilt the persistent deer-vs-car contact feature from working v0.9.7 after earlier v0.9.8/v0.9.9 attempts broke/failed; fixed the Lua local-limit/app-load problem and was explicitly locked as the working collision baseline.","why":"","tag":"v0.9.10","archive_folder":"versions/043_v0.9.10_persistent-contact_working_baseline"},{"order":44,"version":"v0.9.11","description":"Added bounded vehicle momentum-loss/jolt response while preserving the working persistent-contact and tumble behavior.","why":"","tag":"v0.9.11","archive_folder":"versions/044_v0.9.11_car_impact_jolt_momentum_loss"},{"order":45,"version":"v0.9.12","description":"Moved the car jolt to a physics-rate DeerImpactWorker and introduced dynamic local road-width measurement; both became important foundations for later road behavior.","why":"","tag":"v0.9.12","archive_folder":"versions/045_v0.9.12_dynamic_road_physics_worker"},{"order":46,"version":"v0.9.13","description":"Reduced spawn stutter while strengthening the approved impact jolt.","why":"","tag":"v0.9.13","archive_folder":"versions/046_v0.9.13_spawn_stutter_stronger_jolt"},{"order":47,"version":"v0.9.14","description":"Introduced asynchronous spawning and faster road scanning to reduce encounter-time frame disruption.","why":"","tag":"v0.9.14","archive_folder":"versions/047_v0.9.14_async_spawn_fast_road_scan"},{"order":48,"version":"v0.9.15","description":"Spread spawn work across frames for smoother runtime behavior.","why":"","tag":"v0.9.15","archive_folder":"versions/048_v0.9.15_frame-spread_spawn"},{"order":49,"version":"v0.9.16","description":"Improved ground handling and main-road identification after the spawn optimizations.","why":"","tag":"v0.9.16","archive_folder":"versions/049_v0.9.16_ground_main-road_fix"},{"order":50,"version":"v0.9.17","description":"Fixed hidden-deer gait behavior and sky/ground placement edge cases.","why":"","tag":"v0.9.17","archive_folder":"versions/050_v0.9.17_hidden_gait_sky_fix"},{"order":51,"version":"v0.9.18","description":"Retuned group encounter frequency while preserving the current encounter system.","why":"","tag":"v0.9.18","archive_folder":"versions/051_v0.9.18_group_frequency"},{"order":52,"version":"v0.9.19","description":"Added distance-based cleanup to control object lifetime/performance.","why":"","tag":"v0.9.19","archive_folder":"versions/052_v0.9.19_distance_cleanup"},{"order":53,"version":"v0.9.20","description":"Introduced the first skeletal ragdoll prototype into the continued line; later ragdoll work evolved substantially from this stage.","why":"","tag":"v0.9.20","archive_folder":"versions/053_v0.9.20_skeletal_ragdoll_prototype"},{"order":54,"version":"v0.9.21","description":"Gated turnaround behavior using actual road material rather than only distance/progress assumptions.","why":"","tag":"v0.9.21","archive_folder":"versions/054_v0.9.21_road-material_turn_gate"},{"order":55,"version":"v0.9.22","description":"Extended live road-material gating to all special road behaviors.","why":"","tag":"v0.9.22","archive_folder":"versions/055_v0.9.22_all_road-material_behavior_gates"},{"order":56,"version":"v0.9.23","description":"Measured live pavement entry/exit windows for more accurate behavior eligibility.","why":"","tag":"v0.9.23","archive_folder":"versions/056_v0.9.23_live_road-entry_windows"},{"order":57,"version":"v0.9.24","description":"Improved edge-of-road behavior and recovery from bad/brief ground samples.","why":"","tag":"v0.9.24","archive_folder":"versions/057_v0.9.24_edge_behavior_ground_recovery"},{"order":58,"version":"v0.9.25","description":"Performance foundation with 30 Hz animation/terrain updates plus collision/contact broad-phase work; repeatedly restored as the clean base for later ragdoll development.","why":"","tag":"v0.9.25","archive_folder":"versions/058_v0.9.25_performance_foundation"},{"order":59,"version":"v0.9.38","description":"Added high-speed reactions based on time to arrival, road-commit behavior, and the 34-pivot ragdoll solver.","why":"","tag":"v0.9.38","archive_folder":"versions/059_v0.9.38_road-committed_reactions_flat-logical_ragdoll"},{"order":60,"version":"v0.9.40","description":"Removed old 90° visual correction; aligned authored Deer v4 forward direction with Lua movement.","why":"","tag":"v0.9.40","archive_folder":"versions/060_v0.9.40_Deer_v4_Orientation"},{"order":61,"version":"v0.9.41","description":"Physical speed now eases with stop/start animation timing.","why":"","tag":"v0.9.41","archive_folder":"versions/061_v0.9.41_Gait_Transition_Motion_Sync"},{"order":62,"version":"v0.9.42","description":"Surface-plane alignment, faster turn, terrain seam recovery, heavier vehicle impact.","why":"","tag":"v0.9.42","archive_folder":"versions/062_v0.9.42_Terrain_Turn_Impact_Baseline"},{"order":63,"version":"v0.9.43","description":"Fixed stationary walk/run-in-place states, removed older segmented impact solver, added native body/engine damage.","why":"","tag":"v0.9.43","archive_folder":"versions/063_v0.9.43_Stationary_Safety_and_Native_Damage"},{"order":64,"version":"v0.9.44","description":"Correct Lua-app damage setters and tighter deer collision volumes; proven impact baseline.","why":"","tag":"v0.9.44","archive_folder":"versions/064_v0.9.44_Damage_Setter_and_Hitbox_Fix"},{"order":65,"version":"v0.9.45","description":"Impact-pose freeze plus passive skeletal limp control function renderChapters(){$('chapters').innerHTML=PHASES.map((p,i)=>'<button class="chapter '+(activePhase===i?'active':'')+'" data-phase="'+i+'" style="--swatch:'+COLORS[i]+'"><i class="swatch"></i>'+esc(p.name)+'<small>'+ (p.end-p.start+1)+'</small></button>').join('');document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{activePhase=Number(b.dataset.phase);const p=PHASES[activePhase];scale=1.9;tx=750-p.cx*scale;ty=450-p.cy*scale;updateTransform();renderChapters();highlight()})}
function renderMatches(){if(!query){$('matches').innerHTML='<span class="sub">Type above to find a version or feature.</span>';return}const m=DATA.filter(v=>[v.version,v.description,v.why||''].join(' ').toLowerCase().includes(query)).slice(0,15);$('matches').innerHTML=m.map(v=>'<button class="match" data-result="'+v.order+'">'+esc(v.version)+'<small>'+esc(v.description)+'</small></button>').join('')||'<span class="sub">No matching versions.</span>';document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.result);select(n);focus(DATA[n-1])})}
function select(order){selected=order;const v=DATA[order-1];let h='<div class="overline">Version '+String(order).padStart(3,'0')+' / 121</div><h2 class="version">'+esc(v.version)+'</h2><div class="pill" style="border-color:'+COLORS[v.phase]+';color:'+COLORS[v.phase]+'">'+esc(PHASES[v.phase].name)+'</div><div class="section"><h3>What changed / why it mattered</h3><div class="purpose">'+esc(v.description)+'</div>';if(v.why)h+='<p class="why">'+esc(v.why)+'</p>';h+='<div class="pager"><button id="prev" '+(order===1?'disabled':'')+'>← Previous</button><button id="next" '+(order===121?'disabled':'')+'>Next →</button></div><a class="action" target="_blank" rel="noopener" href="'+REPO+'/tree/main/'+urlpath(v.archive_folder)+'">Browse version files ↗</a><a class="action secondary" target="_blank" rel="noopener" href="'+REPO+'/tree/'+encodeURIComponent(v.tag)+'">Open exact version tag ↗</a><div class="section hint">The mod files remain in the private repository. Sign in to the authorized GitHub account to browse them. <a target="_blank" rel="noopener" href="'+REPO+'/blob/main/VERSION-HISTORY.md">Full version history ↗</a></div>';$('inspector').innerHTML=h;if(location.hash!=='#v'+order)history.replaceState(null,'','#v'+order);$('prev').onclick=()=>select(order-1);$('next').onclick=()=>select(order+1);highlight()}
$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderMatches();highlight();if(query.length>=2){const v=DATA.find(v=>[v.version,v.description,v.why||''].join(' ').toLowerCase().includes(query));if(v){select(v.order);focus(v)}}});window.addEventListener('hashchange',()=>{const n=Number(location.hash.match(/^#v(\d+)$/)?.[1]);if(n>=1&&n<=DATA.length)select(n)});renderChapters();renderMatches();select(Number(location.hash.match(/^#v(\d+)$/)?.[1])||121);updateTransform();
</script>
</body>
</html>
